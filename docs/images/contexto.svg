<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="contexto-title contexto-desc">
  <title id="contexto-title">Pelis: diagrama de contexto</title>
  <desc id="contexto-desc">Espectador y dueño de la biblioteca usan Pelis, que lee y escribe en el disco de la biblioteca, trae datos de OMDb y sinopsis de TMDb, y abre carpetas y videos con el sistema operativo.</desc>
  <defs>
    <marker id="contexto-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa6bb"/>
    </marker>
    <marker id="contexto-flecha-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dfeaff"/>
    </marker>
    <style>
      .nombre { font: 600 15px "Archivo Narrow", "Arial Narrow", "Liberation Sans Narrow", sans-serif; fill: #f1ebde; letter-spacing: 0.3px; }
      .sub { font: 11px ui-monospace, "DejaVu Sans Mono", Menlo, monospace; fill: #9aa6bb; }
      .tag { font: 600 8px ui-monospace, "DejaVu Sans Mono", Menlo, monospace; letter-spacing: 1px; }
      .flecha { font: 600 9px ui-monospace, "DejaVu Sans Mono", Menlo, monospace; fill: #9aa6bb; letter-spacing: 0.8px; text-anchor: middle; }
      .leyenda { font: 11px ui-monospace, "DejaVu Sans Mono", Menlo, monospace; fill: #9aa6bb; }
    </style>
  </defs>

  <rect width="960" height="480" fill="#0e131c"/>

  <!-- Flechas (antes que las cajas) -->
  <g fill="none" stroke-width="1.2">
    <line x1="240" y1="168" x2="380" y2="168" stroke="#9aa6bb" marker-end="url(#contexto-flecha)"/>
    <path d="M200,344 V272 Q200,264 208,264 H380" stroke="#9aa6bb" marker-end="url(#contexto-flecha)"/>
    <line x1="240" y1="376" x2="720" y2="376" stroke="#9aa6bb" marker-end="url(#contexto-flecha)"/>
    <path d="M540,152 V80 Q540,72 548,72 H720" stroke="#dfeaff" marker-end="url(#contexto-flecha-red)"/>
    <line x1="580" y1="168" x2="720" y2="168" stroke="#dfeaff" marker-end="url(#contexto-flecha-red)"/>
    <line x1="580" y1="264" x2="720" y2="264" stroke="#9aa6bb" marker-end="url(#contexto-flecha)"/>
    <path d="M540,280 V336 Q540,344 548,344 H720" stroke="#9aa6bb" marker-end="url(#contexto-flecha)"/>
  </g>

  <!-- Rótulos de las flechas -->
  <g>
    <rect x="264" y="146" width="92" height="14" fill="#0e131c"/>
    <text class="flecha" x="310" y="156">ELIGE Y MIRA</text>
    <rect x="236" y="242" width="116" height="14" fill="#0e131c"/>
    <text class="flecha" x="294" y="252">ESCANEA Y EDITA</text>
    <rect x="420" y="354" width="104" height="14" fill="#0e131c"/>
    <text class="flecha" x="472" y="364">COPIA CARPETAS</text>
    <rect x="584" y="50" width="104" height="14" fill="#0e131c"/>
    <text class="flecha" x="636" y="60">DATOS Y PÓSTER</text>
    <rect x="590" y="146" width="104" height="14" fill="#0e131c"/>
    <text class="flecha" x="642" y="156">SINOPSIS EN ES</text>
    <rect x="606" y="242" width="80" height="14" fill="#0e131c"/>
    <text class="flecha" x="646" y="252">ABRE CON</text>
    <rect x="584" y="322" width="104" height="14" fill="#0e131c"/>
    <text class="flecha" x="636" y="332">LEE Y ESCRIBE</text>
  </g>

  <!-- Personas -->
  <g>
    <rect x="40" y="136" width="200" height="64" rx="3" fill="#0e131c" stroke="#f1ebde" stroke-width="1"/>
    <text class="tag" x="52" y="154" fill="#9aa6bb">PERSONA</text>
    <text class="nombre" x="52" y="174">Espectador</text>
    <text class="sub" x="52" y="190">elige, mira, retoma</text>

    <rect x="40" y="344" width="200" height="64" rx="3" fill="#0e131c" stroke="#f1ebde" stroke-width="1"/>
    <text class="tag" x="52" y="362" fill="#9aa6bb">PERSONA</text>
    <text class="nombre" x="52" y="382">Dueño de la biblioteca</text>
    <text class="sub" x="52" y="398">arma y corrige la colección</text>
  </g>

  <!-- El sistema -->
  <g>
    <rect x="380" y="152" width="200" height="128" rx="3" fill="#1d2636" stroke="#e0453a" stroke-width="1.6"/>
    <rect x="392" y="164" width="44" height="14" rx="2" fill="#e0453a"/>
    <text class="tag" x="398" y="174" fill="#0e131c">APP</text>
    <text x="392" y="212" fill="#f1ebde" style="font: 700 28px 'Archivo Narrow', 'Arial Narrow', 'Liberation Sans Narrow', sans-serif; letter-spacing: 2px;">PELIS</text>
    <text class="sub" x="392" y="236">catálogo y reproductor</text>
    <text class="sub" x="392" y="252">de escritorio</text>
    <text class="sub" x="392" y="268">PySide6 + QML · SQLite</text>
  </g>

  <!-- Sistemas externos -->
  <g>
    <rect x="720" y="40" width="200" height="64" rx="3" fill="#161d2a" stroke="#dfeaff" stroke-width="1"/>
    <text class="tag" x="732" y="58" fill="#dfeaff">INTERNET</text>
    <text class="nombre" x="732" y="78">OMDb</text>
    <text class="sub" x="732" y="94">datos, IMDb ID, póster</text>

    <rect x="720" y="136" width="200" height="64" rx="3" fill="#161d2a" stroke="#dfeaff" stroke-width="1"/>
    <text class="tag" x="732" y="154" fill="#dfeaff">INTERNET</text>
    <text class="nombre" x="732" y="174">TMDb</text>
    <text class="sub" x="732" y="190">sinopsis en español</text>

    <rect x="720" y="232" width="200" height="64" rx="3" fill="#161d2a" stroke="#4a5872" stroke-width="1"/>
    <text class="tag" x="732" y="250" fill="#9aa6bb">LOCAL</text>
    <text class="nombre" x="732" y="270">Sistema operativo</text>
    <text class="sub" x="732" y="286">explorador, otro reproductor</text>

    <rect x="720" y="328" width="200" height="64" rx="3" fill="#161d2a" stroke="#4a5872" stroke-width="1"/>
    <text class="tag" x="732" y="346" fill="#9aa6bb">LOCAL</text>
    <text class="nombre" x="732" y="366">Disco de la biblioteca</text>
    <text class="sub" x="732" y="382">videos, pelis.json, pósters</text>
  </g>

  <!-- Leyenda -->
  <line x1="40" y1="432" x2="920" y2="432" stroke="#4a5872" stroke-width="1"/>
  <g>
    <rect x="40" y="448" width="12" height="12" rx="2" fill="none" stroke="#f1ebde"/>
    <text class="leyenda" x="60" y="458">persona</text>
    <rect x="140" y="448" width="12" height="12" rx="2" fill="#1d2636" stroke="#e0453a" stroke-width="1.6"/>
    <text class="leyenda" x="160" y="458">Pelis</text>
    <rect x="228" y="448" width="12" height="12" rx="2" fill="#161d2a" stroke="#dfeaff"/>
    <text class="leyenda" x="248" y="458">usa internet</text>
    <rect x="364" y="448" width="12" height="12" rx="2" fill="#161d2a" stroke="#4a5872"/>
    <text class="leyenda" x="384" y="458">sin internet</text>
  </g>
</svg>
