[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pelis"
dynamic = ["version"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6",
    "requests",
    "pysubs2",
]

[dependency-groups]
dev = ["pytest", "pyinstaller"]

[tool.setuptools.dynamic]
version = {attr = "pelis.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
